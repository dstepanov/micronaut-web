name: Deploy Guides

on:
  repository_dispatch:
    types:
      - guides-updated
  workflow_dispatch:
    inputs:
      guides_repository:
        description: Guides repository to build from
        required: false
        default: micronaut-projects/micronaut-guides
      guides_ref:
        description: Guides branch, tag, or SHA to build from
        required: false
        default: master

permissions:
  contents: write

concurrency:
  group: guides-pages
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: micronaut-projects/micronaut-guides-v2
  TARGET_BRANCH: gh-pages

run-name: Publish guides from ${{ github.event.client_payload.sha || inputs.guides_ref || 'master' }}

jobs:
  publish:
    name: Build and publish guides
    runs-on: ubuntu-latest
    steps:
      - name: Check out Micronaut web
        uses: actions/checkout@v7

      - name: Validate GitHub token
        env:
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
        run: |
          if [ "$HAS_GH_TOKEN" != "true" ]; then
            echo "::error::Set GH_TOKEN with contents:write access to $TARGET_REPOSITORY."
            exit 1
          fi

      - name: Check out guides Pages repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          path: published-guides
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out guides project
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.guides_repository || 'micronaut-projects/micronaut-guides' }}
          ref: ${{ github.event.client_payload.sha || inputs.guides_ref || 'master' }}
          path: external/micronaut-guides

      - name: Resolve guides revision
        id: guides
        working-directory: external/micronaut-guides
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci


      - name: Configure guides deployment
        env:
          CONFIGURED_GITHUB_PAGES_ORIGIN: ${{ vars.MICRONAUT_GITHUB_PAGES_ORIGIN || vars.DEFAULT_GITHUB_PAGES_ORIGIN }}
          CONFIGURED_MAIN_SITE_URL: ${{ vars.MICRONAUT_MAIN_SITE_URL }}
          CONFIGURED_DOCS_SITE_URL: ${{ vars.MICRONAUT_DOCS_SITE_URL }}
          CONFIGURED_GUIDES_SITE_URL: ${{ vars.MICRONAUT_GUIDES_SITE_URL }}
          CONFIGURED_CUSTOM_DOMAIN: ${{ vars.MICRONAUT_GUIDES_CUSTOM_DOMAIN }}
          CONFIGURED_SURFACE_BASE: ${{ vars.MICRONAUT_GUIDES_BASE }}
          PUBLISHED_DIRECTORY: published-guides
        run: node scripts/configure-pages-deployment.ts --surface guides --target-repository "$TARGET_REPOSITORY" --published-dir "$PUBLISHED_DIRECTORY"

      - name: Build guides surface
        env:
          MICRONAUT_DEPLOY_SURFACE: guides
          MICRONAUT_GUIDES_ROOT: /
          MICRONAUT_GUIDES_LATEST_ROOT: /
          MICRONAUT_GUIDES_DIR: ${{ github.workspace }}/external/micronaut-guides
          GUIDES_RENDER_ALL: "true"
          GUIDES_RENDER_STRICT: "true"
        run: npm run build:guides

      - name: Replace guides Pages artifact
        env:
          GUIDES_SHA: ${{ steps.guides.outputs.sha }}
        run: |
          find published-guides -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. published-guides/
          # Records the built revision so the upstream poller sees that master
          # moved even when the rendered output is byte-identical.
          echo "$GUIDES_SHA" > published-guides/.guides-revision

      - name: Commit and push guides Pages branch
        working-directory: published-guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Publish Micronaut guides from ${{ steps.guides.outputs.sha }}"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          else
            echo "Guides Pages branch is already up to date."
          fi
