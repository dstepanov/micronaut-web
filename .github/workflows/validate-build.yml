name: Validate Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check script formatting
        run: npm run style:scripts

      - name: Run docs tests
        env:
          ASTRO_BASE: /micronaut-docs-v2/
          MICRONAUT_DEPLOY_SURFACE: docs
          MICRONAUT_DOCS_ROOT: /latest
          MICRONAUT_DOCS_LATEST_ROOT: /latest
          PLAYWRIGHT_STATIC_PREVIEW: "true"
        run: npm run test:docs

      - name: Run guides tests
        env:
          ASTRO_BASE: /micronaut-guides-v2/
          MICRONAUT_DEPLOY_SURFACE: guides
          MICRONAUT_GUIDES_ROOT: /
          MICRONAUT_GUIDES_LATEST_ROOT: /
          PLAYWRIGHT_STATIC_PREVIEW: "true"
        run: npm run test:guides

      - name: Run build checks and build site
        run: npm run build:main
