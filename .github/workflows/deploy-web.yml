name: Deploy Web

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - micronaut-starter-ui-published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Configure GitHub Pages paths
        env:
          CONFIGURED_GITHUB_PAGES_ORIGIN: ${{ vars.MICRONAUT_GITHUB_PAGES_ORIGIN || vars.DEFAULT_GITHUB_PAGES_ORIGIN }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ] || [ -f public/CNAME ]; then
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "ASTRO_BASE=/$repo_name/" >> "$GITHUB_ENV"
          fi
          default_github_pages_origin="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          github_pages_origin="${CONFIGURED_GITHUB_PAGES_ORIGIN:-$default_github_pages_origin}"
          echo "DEFAULT_GITHUB_PAGES_ORIGIN=$default_github_pages_origin" >> "$GITHUB_ENV"
          echo "MICRONAUT_GITHUB_PAGES_ORIGIN=$github_pages_origin" >> "$GITHUB_ENV"
          if [ -f public/CNAME ]; then
            custom_domain="$(tr -d '[:space:]' < public/CNAME)"
            echo "MICRONAUT_MAIN_SITE_URL=https://$custom_domain/" >> "$GITHUB_ENV"
          fi

      - name: Build web
        env:
          MICRONAUT_DEPLOY_SURFACE: main
          # Cross-surface links should use the production custom domains, not
          # the temporary GitHub Pages project URLs: those 301 to the domains
          # without CORS headers, which kills browser fetches such as the
          # guides manifest the search dialog loads.
          MICRONAUT_DOCS_SITE_URL: https://docs.micronaut.io/
          MICRONAUT_GUIDES_SITE_URL: https://guides.micronaut.io/
          MICRONAUT_SKIP_MAIN_SITE_BROWSER_TESTS: "true"
        run: npm run build:main

      - name: Include Micronaut Launch frontend
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          git archive FETCH_HEAD launch | tar -x -C dist

      - name: Ensure GitHub Pages serves underscore assets
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload web Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy web Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
