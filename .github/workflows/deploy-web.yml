name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Configure GitHub Pages paths
        env:
          CONFIGURED_GITHUB_PAGES_ORIGIN: ${{ vars.MICRONAUT_GITHUB_PAGES_ORIGIN || vars.DEFAULT_GITHUB_PAGES_ORIGIN }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "ASTRO_BASE=/$repo_name/" >> "$GITHUB_ENV"
          fi
          default_github_pages_origin="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          github_pages_origin="${CONFIGURED_GITHUB_PAGES_ORIGIN:-$default_github_pages_origin}"
          echo "DEFAULT_GITHUB_PAGES_ORIGIN=$default_github_pages_origin" >> "$GITHUB_ENV"
          echo "MICRONAUT_GITHUB_PAGES_ORIGIN=$github_pages_origin" >> "$GITHUB_ENV"

      # The main surface renders no guide content, so it builds its search
      # index from the checked-in guide catalog. Refreshing it here keeps the
      # index describing the guides that are actually published; the catalog
      # in the tree is only the offline fallback. A failure fails the deploy
      # rather than quietly publishing an index that is missing guides.
      - name: Sync the published guide catalog
        env:
          MICRONAUT_GUIDES_SITE_URL: ${{ vars.MICRONAUT_GUIDES_SITE_URL }}
        run: npm run sync:guides

      - name: Build web
        env:
          MICRONAUT_DEPLOY_SURFACE: main
          MICRONAUT_SKIP_MAIN_SITE_BROWSER_TESTS: "true"
        run: npm run build:main

      - name: Ensure GitHub Pages serves underscore assets
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload web Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy web Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
