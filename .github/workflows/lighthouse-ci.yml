name: Lighthouse CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.surface }} surface
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface: [main, docs, guides]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build ${{ matrix.surface }} surface
        env:
          ASTRO_BASE: ${{ matrix.surface == 'main' && '/micronaut-web/' || matrix.surface == 'docs' && '/micronaut-docs-v2/' || '/micronaut-guides-v2/' }}
          MICRONAUT_DEPLOY_SURFACE: ${{ matrix.surface }}
          MICRONAUT_DOCS_ROOT: /latest
          MICRONAUT_DOCS_LATEST_ROOT: /latest
          MICRONAUT_GUIDES_ROOT: /
          MICRONAUT_GUIDES_LATEST_ROOT: /
          MICRONAUT_PREPARE_GENERATED_CONTENT: "false"
          MICRONAUT_DOCS_CATALOG_FALLBACK: "true"
        run: npm run build:surface -- --surface ${{ matrix.surface }}

      - name: Run Lighthouse CI for light and dark themes
        env:
          MICRONAUT_DEPLOY_SURFACE: ${{ matrix.surface }}
        run: npm run audit:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.surface }}
          path: .lighthouseci
          if-no-files-found: warn
