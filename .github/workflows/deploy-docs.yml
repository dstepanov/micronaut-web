name: Deploy Docs

on:
  repository_dispatch:
    types:
      - platform-released
  workflow_dispatch:
    inputs:
      docs_version:
        description: Release to publish, for example 5.0.3 (served from /5.0.x/)
        required: true

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: micronaut-projects/micronaut-docs-v2
  TARGET_BRANCH: gh-pages
  PLATFORM_REPOSITORY: micronaut-projects/micronaut-platform

run-name: Publish docs ${{ github.event.client_payload.version || inputs.docs_version }}

jobs:
  publish:
    name: Build and publish docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out Micronaut web
        uses: actions/checkout@v7

      - name: Validate GitHub token
        env:
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
        run: |
          if [ "$HAS_GH_TOKEN" != "true" ]; then
            echo "::error::Set GH_TOKEN with contents:write access to $TARGET_REPOSITORY."
            exit 1
          fi

      - name: Check out docs Pages repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          path: published-docs
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve docs release
        id: release
        env:
          DOCS_VERSION: ${{ github.event.client_payload.version || inputs.docs_version }}
          PLATFORM_REF: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$DOCS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Docs version must use major.minor.patch with an optional prerelease suffix; received '$DOCS_VERSION'."
            exit 1
          fi
          # Docs are published per release line, so 5.0.3 replaces the same
          # /5.0.x tree 5.0.2 published and no earlier patch has to be purged.
          docs_line="$(node --input-type=module --eval 'import { docsVersionLine } from "./scripts/update-docs-version-manifest.ts"; process.stdout.write(docsVersionLine(process.env.DOCS_VERSION));')"
          # The line is replaced wholesale, so a replayed or re-dispatched
          # release event for an older patch must not overwrite a newer one.
          superseded_by="$(node --input-type=module --eval 'import { supersedingDocsLineRelease } from "./scripts/update-docs-version-manifest.ts"; process.stdout.write((await supersedingDocsLineRelease({ publishedDirectory: "published-docs", version: process.env.DOCS_VERSION })) || "");')"
          if [ -n "$superseded_by" ]; then
            echo "::error::/$docs_line already publishes $superseded_by; refusing to overwrite it with the older $DOCS_VERSION."
            exit 1
          fi
          # /latest redirects to the newest retained line, so it moves only when
          # the version being published is newer than everything already there.
          publish_latest="$(node --input-type=module --eval 'import { isNewestPublishedDocsVersion } from "./scripts/update-docs-version-manifest.ts"; process.stdout.write(String(await isNewestPublishedDocsVersion({ publishedDirectory: "published-docs", version: process.env.DOCS_VERSION })));')"
          echo "docs_version=$DOCS_VERSION" >> "$GITHUB_OUTPUT"
          echo "docs_line=$docs_line" >> "$GITHUB_OUTPUT"
          echo "platform_ref=${PLATFORM_REF:-$DOCS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Check out platform project
        env:
          DOCS_VERSION: ${{ steps.release.outputs.docs_version }}
          PLATFORM_REF: ${{ steps.release.outputs.platform_ref }}
        run: |
          set -euo pipefail
          target="external/docs/repos/micronaut-platform"
          repo_url="https://github.com/${PLATFORM_REPOSITORY}.git"
          effective_ref="${PLATFORM_REF:-$DOCS_VERSION}"
          mkdir -p "$(dirname "$target")"
          git init --initial-branch=checkout "$target"
          git -C "$target" remote add origin "$repo_url"
          echo "Resolving $PLATFORM_REPOSITORY ref '$effective_ref'."

          if git -C "$target" ls-remote --exit-code --heads origin "$effective_ref" >/dev/null; then
            git -C "$target" fetch --depth=1 origin "refs/heads/${effective_ref}:refs/remotes/origin/${effective_ref}"
            git -C "$target" checkout --detach "refs/remotes/origin/${effective_ref}"
          else
            resolved_tag="$effective_ref"
            if ! git -C "$target" ls-remote --exit-code --tags origin "$resolved_tag" >/dev/null; then
              if [ "${effective_ref#v}" = "$effective_ref" ] && git -C "$target" ls-remote --exit-code --tags origin "v$effective_ref" >/dev/null; then
                resolved_tag="v$effective_ref"
              fi
            fi

            if git -C "$target" ls-remote --exit-code --tags origin "$resolved_tag" >/dev/null; then
              git -C "$target" fetch --depth=1 origin "refs/tags/${resolved_tag}:refs/tags/${resolved_tag}"
              git -C "$target" checkout --detach "refs/tags/${resolved_tag}"
            else
              if ! git -C "$target" fetch --depth=1 origin "$effective_ref"; then
                echo "::error::Could not resolve $PLATFORM_REPOSITORY ref '$effective_ref' as a branch, tag, v-prefixed tag, raw ref, or SHA."
                exit 1
              fi
              git -C "$target" checkout --detach FETCH_HEAD
            fi
          fi

          git -C "$target" rev-parse --short HEAD


      - name: Configure docs deployment
        env:
          CONFIGURED_GITHUB_PAGES_ORIGIN: ${{ vars.MICRONAUT_GITHUB_PAGES_ORIGIN || vars.DEFAULT_GITHUB_PAGES_ORIGIN }}
          # Cross-surface links must use the production custom domains: the
          # GitHub Pages project URLs 301 to them without CORS headers, which
          # kills browser fetches such as the related-guides manifest load.
          CONFIGURED_MAIN_SITE_URL: ${{ vars.MICRONAUT_MAIN_SITE_URL || 'https://micronaut.io/' }}
          CONFIGURED_DOCS_SITE_URL: ${{ vars.MICRONAUT_DOCS_SITE_URL }}
          CONFIGURED_GUIDES_SITE_URL: ${{ vars.MICRONAUT_GUIDES_SITE_URL || 'https://guides.micronaut.io/' }}
          CONFIGURED_CUSTOM_DOMAIN: ${{ vars.MICRONAUT_DOCS_CUSTOM_DOMAIN }}
          CONFIGURED_SURFACE_BASE: ${{ vars.MICRONAUT_DOCS_BASE }}
          PUBLISHED_DIRECTORY: published-docs
        run: node scripts/configure-pages-deployment.ts --surface docs --target-repository "$TARGET_REPOSITORY" --published-dir "$PUBLISHED_DIRECTORY"

      - name: Build docs version manifest
        run: node scripts/update-docs-version-manifest.ts --published-dir published-docs --version "${{ steps.release.outputs.docs_version }}" --latest "${{ steps.release.outputs.publish_latest }}"

      - name: Build docs surface
        env:
          MICRONAUT_DEPLOY_SURFACE: docs
          MICRONAUT_DOCS_ROOT: /${{ steps.release.outputs.docs_line }}
          MICRONAUT_DOCS_LATEST_ROOT: /latest
          DOCS_DIR: ${{ github.workspace }}/external/docs
          DOCS_RENDER_ALL: "true"
          DOCS_RENDER_STRICT: "true"
          DOCS_SYNC_SOURCES: "true"
        run: npm run build:docs

      - name: Merge docs artifact
        run: node scripts/publish-docs-surface.ts --dist dist --published-dir published-docs --version "${{ steps.release.outputs.docs_version }}" --latest "${{ steps.release.outputs.publish_latest }}" --base "$ASTRO_BASE"

      - name: Commit and push docs Pages branch
        working-directory: published-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Publish Micronaut docs ${{ steps.release.outputs.docs_version }}"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          else
            echo "Docs Pages branch is already up to date."
          fi

      - name: Ensure docs Pages custom domain
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCS_CUSTOM_DOMAIN: ${{ vars.MICRONAUT_DOCS_CUSTOM_DOMAIN || 'docs.micronaut.io' }}
        run: |
          gh api --method PUT "repos/${TARGET_REPOSITORY}/pages" \
            -f "cname=${DOCS_CUSTOM_DOMAIN}" >/dev/null

      # Pages builds the branch asynchronously, and a second push while a build
      # is still queued leaves the site reporting "Page build failed" for content
      # that is in fact served. Finish only once the pushed commit is built, so
      # the per-version republish runs cannot overlap.
      - name: Wait for docs Pages build
        working-directory: published-docs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 60); do
            read -r status commit < <(gh api "repos/${TARGET_REPOSITORY}/pages/builds/latest" --jq '"\(.status) \(.commit)"')
            if [ "$commit" = "$sha" ] && [ "$status" = "built" ]; then
              exit 0
            fi
            if [ "$commit" = "$sha" ] && [ "$status" = "errored" ]; then
              echo "::error::GitHub Pages build failed for ${TARGET_REPOSITORY}@${sha}."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the GitHub Pages build of ${TARGET_REPOSITORY}@${sha}."
          exit 1
