name: Republish Published Docs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: republish-published-docs
  cancel-in-progress: false

jobs:
  republish:
    name: Republish published docs from oldest to newest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TARGET_REPOSITORY: micronaut-projects/micronaut-docs-v2
      TARGET_BRANCH: gh-pages
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - name: Check out published docs
        uses: actions/checkout@v7
        with:
          repository: micronaut-projects/micronaut-docs-v2
          ref: gh-pages
          path: published-docs
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Find published versions
        id: versions
        run: |
          set -euo pipefail
          # A line folder is named /5.0.x, so the release it was built from only
          # survives in versions.json. Legacy exact-version folders predate that
          # and are still worth republishing onto their line.
          mapfile -t versions < <(
            {
              jq -r '.versions[].release // empty' published-docs/versions.json 2>/dev/null || true
              find published-docs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true
            } | sort -V -u
          )

          if [ "${#versions[@]}" -eq 0 ]; then
            echo "No published docs versions were found in ${TARGET_REPOSITORY}:${TARGET_BRANCH}."
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Published versions, oldest first:\n%s\n' "${versions[*]}"
          printf '%s\n' "${versions[@]}" > "$RUNNER_TEMP/published-docs-versions"
          echo "has_versions=true" >> "$GITHUB_OUTPUT"

      - name: Trigger and wait for each republish
        if: steps.versions.outputs.has_versions == 'true'
        env:
          VERSION_FILE: ${{ runner.temp }}/published-docs-versions
        run: |
          set -euo pipefail
          while IFS= read -r version; do
            title="Publish docs ${version}"
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Dispatching ${version}."
            gh workflow run deploy-docs.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              --field "docs_version=$version"

            run_id=""
            for attempt in {1..24}; do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-docs.yml --event workflow_dispatch --limit 50 --json databaseId,displayTitle,createdAt | jq -r --arg title "$title" --arg since "$started" '[.[] | select(.displayTitle == $title and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done

            if [ -z "$run_id" ]; then
              echo "::error::Could not find the workflow run for ${version}."
              exit 1
            fi

            echo "Waiting for docs publish run ${run_id} (${version})."
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          done < "$VERSION_FILE"
